services:
  dns_server:
    image: ubuntu/bind9:latest
    container_name: dns_server
    command: ["-4"]
    cap_add:
      - NET_ADMIN
    ports:
      - "1053:53/udp"
      - "1053:53/tcp"
    environment:
      - BIND9_USER=root
    networks:
      services_net:
        ipv4_address: 172.20.0.10
    volumes:
      - ./named.conf.local:/etc/bind/named.conf.local:ro
      - ./named.conf.options:/etc/bind/named.conf.options:ro
      - ./rndc.key:/etc/bind/rndc.key:ro
      - ./db.empresa.local:/etc/bind/zones/db.empresa.local
      - ./db.172.20:/etc/bind/zones/db.172.20
      - ./db.172.30:/etc/bind/zones/db.172.30
      - ./db.172.40:/etc/bind/zones/db.172.40
    restart: always

  nas_backups:
    build:
      context: ../../
      dockerfile: stacks/services/Dockerfile
    container_name: nas_backups
    env_file:
      - ../development/.env
      - ../production/.env
    networks:
      services_net:
        ipv4_address: 172.20.0.11
    volumes:
      - ./backups:/backups
      - ./backup.conf:/etc/backup.conf
    environment:
      - BACKUP_CRON_EXPRESSION=0 2 * * *
    restart: always

  ssh_manager:
    build:
      context: ./ssh
      dockerfile: Dockerfile
    container_name: ssh_manager
    networks:
      services_net:
        ipv4_address: 172.20.0.12
    volumes:
      - ./ssh/authorized_keys:/home/admin_user/.ssh/authorized_keys:ro
    restart: always

networks:
  services_net:
    external: true
