
services:  
  dns_server:
    image: ubuntu/bind9:latest
    container_name: dns_server
    cap_add:
      - NET_ADMIN
    environment:
    - BIND9_USER=root
    networks:
      services_net:
        ipv4_address: 172.20.0.10
    volumes:
      - ./named.conf.local:/etc/bind/named.conf.local
      - ./db.prod:/etc/bind/db.prod
      - ./db.dev:/etc/bind/db.dev
    restart: always
  
  nas_backups:
    build:
      context: ../../
      dockerfile: stacks/services/Dockerfile
    container_name: nas_backups
    env_file:
      - ../development/.env
      - ../production/.env
    networks:
      services_net:
        ipv4_address: 172.20.0.11
    volumes:
        - ./backups:/backups
        - ./backup.conf:/etc/backup.conf
    environment:
      - BACKUP_CRON_EXPRESSION=0 2 * * *
      - MY_USER=${MYSQL_USER:-as2025}
    restart: always

networks:
  services_net:
    external: true