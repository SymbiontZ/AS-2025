services:
  dns_server:
    image: ubuntu/bind9:latest
    container_name: dns_server
    command: ["-4"]
    cap_add:
      - NET_ADMIN
    ports:
      - "1053:53/udp"
      - "1053:53/tcp"
    environment:
      - BIND9_USER=root
    networks:
      services_net:
        ipv4_address: 172.20.0.10
    volumes:
      - ./dns/named.conf.local:/etc/bind/named.conf.local:ro
      - ./dns/named.conf.options:/etc/bind/named.conf.options:ro
      - ./dns/rndc.key:/etc/bind/rndc.key:ro
      - ./dns/db.empresa.local:/etc/bind/zones/db.empresa.local
      - ./dns/db.172.20:/etc/bind/zones/db.172.20
      - ./dns/db.172.30:/etc/bind/zones/db.172.30
      - ./dns/db.172.40:/etc/bind/zones/db.172.40
    restart: always

  nas_backups:
    build:
      context: ../../
      dockerfile: stacks/services/nas/Dockerfile
    container_name: nas_backups
    env_file:
      - ../development/.env
      - ../production/.env
    networks:
      services_net:
        ipv4_address: 172.20.0.30
    volumes:
      - ./nas/backups:/backups
      - ./nas/backup.conf:/etc/backup.conf
    environment:
      - BACKUP_CRON_EXPRESSION=0 2 * * *
    restart: always

  ssh_manager:
    image: linuxserver/openssh-server:latest
    container_name: service-ssh-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - USER_NAME=admin_user
      - SUDO_ACCESS=true
      - LOG_STDOUT=true
    networks:
      services_net:
        ipv4_address: 172.20.0.40
    volumes:
      - ./ssh/config:/config
      - ssh_host_keys:/config/ssh_host_keys
    ports:
      - "2222:2222"
    restart: always

  mail_server:
    build:
      context: ./mail
      dockerfile: Dockerfile
    container_name: mail_server
    hostname: mail.empresa.local
    networks:
      services_net:
        ipv4_address: 172.20.0.50
    ports:
      - "25:25"
      - "143:143"
    restart: always

networks:
  services_net:
    external: true

volumes:
  ssh_host_keys:
