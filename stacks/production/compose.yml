  services:
    postgres:
      image: postgres:16
      container_name: prod_postgres
      restart: unless-stopped
      env_file:
        - .env
      environment:
        POSTGRES_DB: ${POSTGRES_DATABASE:-as2025}
        POSTGRES_USER: ${POSTGRES_USER:-as2025}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ports:
        - "5433:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      networks:
        production_net:
          ipv4_address: 172.30.0.20
        services_net:
          ipv4_address: 172.20.0.21

      healthcheck:
        test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 20s

    ftp_proxy:
      build:
        context: ./ftp-proxy
        dockerfile: Dockerfile
      container_name: prod_ftp_proxy
      hostname: prod-ftp-proxy
      ports:
        - "2121:2121"
        - "2122-2130:2122-2130"
      networks:
        production_net:
          ipv4_address: 172.30.0.40
        development_net:
          ipv4_address: 172.40.0.41
      restart: always

    nginx_server:
      build:
        context: ./nginx
        dockerfile: Dockerfile
      container_name: nginx_server
      cap_add:
        - NET_ADMIN
      command: ["/bin/sh", "-c", "ip route add 172.40.0.0/24 via 172.30.0.2 || true; exec nginx -g 'daemon off;'"]
      ports:
        - "8080:80"
        - "443:443"
      networks:
        production_net:
          ipv4_address: 172.30.0.12
      volumes:
        - ./nginx/conf:/etc/nginx/conf.d:ro
      restart: always

  volumes:
    postgres_data:

  networks:
    production_net:
      external: true
    services_net:
      external: true
    development_net:
      external: true