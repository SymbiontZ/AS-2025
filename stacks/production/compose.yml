  services:
    postgres:
      image: postgres:16
      container_name: prod_postgres
      restart: unless-stopped
      mac_address: "02:42:ac:28:00:02"
      env_file:
        - .env
      environment:
        POSTGRES_DB: ${POSTGRES_DATABASE:-as2025}
        POSTGRES_USER: ${POSTGRES_USER:-as2025}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ports:
        - "5433:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      networks:
        production_net:
          ipv4_address: 172.30.0.20
        services_net:
          ipv4_address: 172.20.0.21

      healthcheck:
        test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 20s

  volumes:
    postgres_data:

  networks:
    production_net:
      external: true
    services_net:
      external: true