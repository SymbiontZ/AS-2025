services:
  mysql:
    image: mysql:8.0
    container_name: dev_mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-as2025}
      MYSQL_USER: ${MYSQL_USER:-as2025}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      development_net:
        ipv4_address: 172.40.0.20
      services_net:
        ipv4_address: 172.20.0.20

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ssh_2fa:
    build:
      context: ./ssh-2fa
      dockerfile: Dockerfile
    container_name: dev_ssh_2fa
    hostname: dev-ssh
    ports:
      - "2223:2222"
    networks:
      development_net:
        ipv4_address: 172.40.0.30
    volumes:
      - ./ssh-2fa/users.conf:/etc/ssh-2fa/users.conf:ro
      - ssh_2fa_secrets:/home
    restart: always

  samba_ftp:
    build:
      context: ./samba-ftp
      dockerfile: Dockerfile
    container_name: dev_samba_ftp
    hostname: dev-samba-ftp
    ports:
      - "21:21"
      - "139:139"
      - "446:445" #Ante posible error de mapeado por conflicto
      - "2132:2132"
      - "2133:2133"
    networks:
      development_net:
        ipv4_address: 172.40.0.40
    volumes:
      - publico_data:/data/publico
    restart: always

  apache_web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: dev_apache_web
    hostname: dev-apache-web
    ports:
      - "80:80"
    networks:
      development_net:
        ipv4_address: 172.40.0.10
    volumes:
      - publico_data:/var/www/ftp_publico:ro
      - ./web/httpd-vhosts.conf:/usr/local/apache2/conf/extra/httpd-vhosts.conf:ro
      - ./web/.htpasswd:/usr/local/apache2/conf/.htpasswd:ro
      - ./web/www:/var/www/www:ro
      - ./web/intranet:/var/www/intranet:ro
    restart: always

volumes:
  mysql_data:
  ssh_2fa_secrets:
  publico_data:

networks:
  development_net:
    external: true
  services_net:
    external: true
        