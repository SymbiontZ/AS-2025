# Virtual Hosts
#
<VirtualHost *:80>
    ServerName www.empresa.local
    DocumentRoot "/var/www/www"
    
    <Directory "/var/www/www">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Alias to access FTP contents
    Alias /publico "/var/www/ftp_publico"
    <Directory "/var/www/ftp_publico">
        Options Indexes FollowSymLinks
        AllowOverride None
        
        # Basic Authentication
        AuthType Basic
        AuthName "Acceso Restringido Documentos"
        AuthUserFile /usr/local/apache2/conf/.htpasswd
        Require valid-user
    </Directory>
    
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 common
</VirtualHost>

<VirtualHost *:80>
    ServerName intranet.empresa.local
    DocumentRoot "/var/www/intranet"
    
    <Directory "/var/www/intranet">
        Options Indexes FollowSymLinks
        AllowOverride None
        
        # Restrict to VPN network only
        Require ip 172.10.0.0/24
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 common
</VirtualHost>
