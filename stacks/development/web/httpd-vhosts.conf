# Virtual Hosts
#
LoadModule usertrack_module modules/mod_usertrack.so
ServerName www.empresa.local

<VirtualHost *:80>
    ServerName www.empresa.local
    DocumentRoot "/var/www/www"
    
    <Directory "/var/www/www">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Alias to access FTP contents
    Alias /publico "/var/www/ftp_publico"
    <Directory "/var/www/ftp_publico">
        Options Indexes FollowSymLinks
        AllowOverride None
        
        # Basic Authentication
        AuthType Basic
        AuthName "Acceso Restringido Documentos"
        AuthUserFile /usr/local/apache2/conf/.htpasswd
        Require valid-user
    </Directory>
    
    # ── APARTADO B ──────────────────────────────────────────────
    # Redirigir .php a página de error personalizada (sin contenido dinámico)
    RedirectMatch 302 \.php$ /errores/php-bloqueado.html

    # Páginas de error personalizadas
    ErrorDocument 403 /errores/403.html
    ErrorDocument 404 /errores/404.html
    # ────────────────────────────────────────────────────────────

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 common
</VirtualHost>

<VirtualHost *:80>
    ServerName intranet.empresa.local
    DocumentRoot "/var/www/intranet"
    
    # Cookie Configuration (mod_usertrack)
    CookieTracking on
    CookieName IdentificadorCliente
    CookieExpires "30 days"
    CookieStyle Cookie

    # Custom Log Format
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" IP_Real: %{X-Forwarded-For}i Cookie: %{IdentificadorCliente}C" proxy_custom_log

    <Directory "/var/www/intranet">
        Options Indexes FollowSymLinks
        AllowOverride None
        
        # Restrict to VPN network only (and allow NATed traffic from firewall)
        Require ip 172.10.0.0/24 172.40.0.2 172.40.0.1
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 proxy_custom_log
</VirtualHost>
