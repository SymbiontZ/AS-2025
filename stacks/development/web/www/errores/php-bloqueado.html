<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Contenido dinámico no permitido</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .code {
            font-size: 5rem;
            font-weight: bold;
            color: #c77dff;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0.5rem 0 1rem;
            color: #f1faee;
        }

        p {
            font-size: 1rem;
            color: #a8a8b3;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: #457b9d;
            border: 1px solid #457b9d;
            padding: 0.5rem 1.2rem;
            border-radius: 4px;
            transition: background 0.2s;
        }

        a:hover {
            background: #457b9d;
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="code">Error</div>
        <h1>Contenido dinámico no permitido</h1>
        <p>Este servidor no ejecuta contenido dinámico.<br>
            Las páginas con extensión <strong>.php</strong> no están disponibles.</p>
        <a href="/">← Volver al inicio</a>
    </div>
</body>

</html>
