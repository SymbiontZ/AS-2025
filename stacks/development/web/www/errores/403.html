<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Acceso no autorizado</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .code {
            font-size: 6rem;
            font-weight: bold;
            color: #e63946;
        }
        h1 {
            font-size: 1.8rem;
            margin: 0.5rem 0 1rem;
            color: #f1faee;
        }
        p {
            font-size: 1rem;
            color: #a8a8b3;
            margin-bottom: 2rem;
        }
        a {
            text-decoration: none;
            color: #457b9d;
            border: 1px solid #457b9d;
            padding: 0.5rem 1.2rem;
            border-radius: 4px;
            transition: background 0.2s;
        }
        a:hover { background: #457b9d; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">403</div>
        <h1>Acceso no autorizado</h1>
        <p>No tienes permiso para acceder a este recurso.</p>
        <a href="/">← Volver al inicio</a>
    </div>
</body>
</html>
